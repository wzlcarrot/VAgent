services:
  postgres:
    image: paradedb/paradedb:0.26.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vagent
      POSTGRES_DB: viewhub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viewhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./ai-end
    ports:
      - "9090:8001"
    env_file:
      - path: .env
        required: false
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: vagent
      PG_DATABASE: viewhub
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      VAGENT_DEMO_MODE: "1"
      LOCK_DEFAULT_PATH: "true"
      DEMO_SEED_ENABLED: "true"
      DEMO_VIDEO_ID: demo01
      ORCHESTRATION_MODE: workflow
      VIDEO_ASR_ENABLED: "false"
      FINETUNE_INTENT_ENABLED: "false"
      WEB_SEARCH_ENABLED: "true"
      TEST_ACCOUNT_ENABLED: "true"
      TEST_ACCOUNT_EMAIL: demo@vagent.local
      TEST_ACCOUNT_PASSWORD_MD5: fa8715d1e327fb038fef4c8c9414387d
      TEST_ACCOUNT_USER_ID: demo_user
      TEST_ACCOUNT_NICKNAME: 演示用户
      ADMIN_API_KEY: vagent-demo-admin
      CORS_ORIGINS: "http://localhost:4091,http://127.0.0.1:4091,http://localhost:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./ai-frontend
      args:
        VITE_DEMO_VIDEO_ID: demo01
    ports:
      - "4091:80"
    depends_on:
      - api
