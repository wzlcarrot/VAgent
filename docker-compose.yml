services:
  ai-agent:
    build: ./ai-end
    ports:
      - "127.0.0.1:9090:8001"
    networks:
      - default
    volumes:
      # FastEmbed 本地 ONNX embedding 模型（避免服务器联网下载 HuggingFace）
      - ./embedding_model/bge-small-en-v1.5:/root/.cache/fastembed/local_models/bge-small-en-v1.5:ro
      # 视频封面文件（sourceName 相对路径，供 /ai/media/cover 读取真实封面）
      - ./cover:/app/data/file/cover:ro
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${POSTGRES_PASSWORD:?请通过 .env 设置强数据库口令 POSTGRES_PASSWORD（禁止用默认口令）}
      - PG_DATABASE=viewhub
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY 环境变量}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M3}
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - ROUTER_LLM_PROVIDER=${ROUTER_LLM_PROVIDER:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请通过 .env 设置 REDIS_PASSWORD（禁止空口令）}
      - TEST_ACCOUNT_ENABLED=${TEST_ACCOUNT_ENABLED:-false}
      - TEST_ACCOUNT_EMAIL=${TEST_ACCOUNT_EMAIL:-}
      - TEST_ACCOUNT_PASSWORD_MD5=${TEST_ACCOUNT_PASSWORD_MD5:-}
      - TEST_ACCOUNT_USER_ID=${TEST_ACCOUNT_USER_ID:-}
      - TEST_ACCOUNT_NICKNAME=${TEST_ACCOUNT_NICKNAME:-测试用户}
      - TEST_ACCOUNT_AVATAR=${TEST_ACCOUNT_AVATAR:-}
      - HARNESS_ENABLED=${HARNESS_ENABLED:-true}
      - AGENT_ASYNC_MAX_WORKERS=${AGENT_ASYNC_MAX_WORKERS:-8}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?请设置强随机 ADMIN_API_KEY（保护 /ai/admin 与 /metrics）}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-frontend:
    build: ./ai-frontend
    ports:
      - "127.0.0.1:4091:80"
    depends_on:
      - ai-agent
    restart: unless-stopped

  postgres:
    # 用 digest 锁定，避免 :latest 漂移导致部署不可复现
    image: paradedb/paradedb@sha256:371e180894738e563404f10486835bcd86ca08eb36af1005bd69a1b0bedb40fe
    ports:
      - "127.0.0.1:9091:5432"
    environment:
      POSTGRES_DB: viewhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过 .env 设置强数据库口令 POSTGRES_PASSWORD（禁止用默认口令）}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./ai-end/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请通过 .env 设置 REDIS_PASSWORD（禁止空口令）}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请通过 .env 设置 REDIS_PASSWORD（禁止空口令）}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:9093:9090"
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?请设置强随机 ADMIN_API_KEY（保护 /ai/admin 与 /metrics）}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml.tpl:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s#__ADMIN_API_KEY__#$${ADMIN_API_KEY}#g" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    depends_on:
      - ai-agent
    restart: unless-stopped

volumes:
  pg_data:
  prometheus_data:
