turn.t05.purpose=片内问答标准问（需配置 video_id）
turn.t05.text=这个视频讲了什么
turn.t05.expect-sse=stage=routing|citations_min=1|type=text|stage=done

turn.t06.session=main
turn.t06.purpose=片内问答换说法
turn.t06.text=帮我总结一下片里的核心观点
turn.t06.expect-sse=stage=routing|citations_min=1|type=text|stage=done

turn.t07.session=main
