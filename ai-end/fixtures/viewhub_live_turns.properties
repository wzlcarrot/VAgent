# ViewHub 15 轮 live 回归（垂直场景，借鉴 Ragent agent-memory 结构）
#
# session=main 复用同一 sessionId；fresh 另开会话测长期记忆（弱断言）
# expect-any  回答文本命中任一即可（| 分隔）
# expect-sse    SSE 顺序断言（| 分隔，语法同 sse_regression）
# feedback      本轮结束后 POST /feedback；feedback-videos=true 用上一轮 videos

anchor=VH-9001
turn.refs=t01,t02,t03,t04,t05,t06,t07,t08,t09,t10,t11,t12,t13,t14,t15

turn.t01.session=main
turn.t01.purpose=植入锚点：工号 + 偏好（库内不存在）
turn.t01.text=先记一下：我的工号是 VH-9001，我特别喜欢科技类视频。后面都按这个来。
turn.t01.expect-any=VH-9001|收到|记住|好的|科技

turn.t02.session=main
turn.t02.purpose=推荐（应产出 videos 或有效文本）
turn.t02.text=给我推荐两个科技类视频看看
turn.t02.expect-sse=stage=routing|type=text|stage=done
turn.t02.expect-any=推荐|视频|科技

turn.t03.session=main
turn.t03.purpose=平台客服 smoke
turn.t03.text=你们平台有什么功能
turn.t03.expect-any=功能|平台|助手|ViewHub

turn.t04.session=main
turn.t04.purpose=个人数据
turn.t04.text=我的硬币有多少
turn.t04.expect-any=硬币|余额|用户

