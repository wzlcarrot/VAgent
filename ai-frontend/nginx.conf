# limit_req_zone 必须在 http 块内
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # 上传文件大小限制（与 ChatInput 5MB 一致；超过 8MB 给 413 错误）
    client_max_body_size 8m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 所有 /ai 路径代理到 Python AI Agent 后端
    location /ai {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://ai-agent:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 支持 — 不缓冲流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;     # 单流最多 5 分钟
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 单页应用：所有非 API 路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}