global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-agent'
    static_configs:
      # 容器网络内用服务名 + 容器端口（9090 是宿主机映射端口）
      - targets: ['ai-agent:8001']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      # prometheus 自身（容器内 9090）
      - targets: ['localhost:9090']
