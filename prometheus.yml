global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-agent'
    static_configs:
      - targets: ['ai-agent:8001']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 5s
    # __ADMIN_API_KEY__ 由 compose 启动时 sed 替换；Prometheus 自身不展开环境变量
    headers:
      X-Admin-Key: __ADMIN_API_KEY__

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
