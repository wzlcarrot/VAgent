name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector 镜像自带 vector 扩展；pg_search 不可用时由 app 自动降级
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viewhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viewhub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 用 127.0.0.1 避免 localhost 解析到 ::1 而 service 只监听 IPv4
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: viewhub
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      # e2e 测试登录用测试账户
      TEST_ACCOUNT_ENABLED: "true"
      TEST_ACCOUNT_EMAIL: test@viewhub.com
      TEST_ACCOUNT_PASSWORD_MD5: e10adc3949ba59abbe56e057f20f883e
      TEST_ACCOUNT_USER_ID: test_user_001
      TEST_ACCOUNT_NICKNAME: 测试用户
      ADMIN_API_KEY: ci-admin-key
    defaults:
      run:
        working-directory: ai-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-end/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Init DB schema
        run: |
          python - <<'PY'
          import sys
          import time
          from app.tools.db.pool import close_global_pool
          from app.tools.db.schema import init_agent_tables
          from app.tools.db import get_cursor

          for attempt in range(1, 13):
              close_global_pool()
              init_agent_tables()
              with get_cursor() as cur:
                  if cur is not None:
                      cur.execute("SELECT to_regclass('public.video_vector_block') AS reg")
                      row = cur.fetchone()
                      reg = (row.get("reg") if isinstance(row, dict) else row[0]) if row else None
                      if reg:
                          print(f"schema ready (attempt {attempt})")
                          sys.exit(0)
              print(f"schema not ready, retry {attempt}/12", flush=True)
              time.sleep(5)
          raise SystemExit("video_vector_block missing after init retries")
          PY

      - name: Pytest
        # 单测以 mock 为主；勿连 CI 的 Postgres/Redis（缺 ViewHub 业务表会误失败）
        env:
          PG_HOST: 127.0.0.2
          REDIS_HOST: 127.0.0.2
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest tests/ --collect-only -q | tail -3
          python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Golden regression scripts
        # tests/test_golden_set.py：关键词路径黄金集下限（不调 LLM）
        run: |
          python scripts/workflow_golden_set.py
          python scripts/behavior_golden_set.py
          python scripts/intent_ternary_regression.py
          python scripts/synonym_video_qa_eval.py
          python scripts/memory_regression.py
          python scripts/sse_regression.py --offline
          python scripts/promote_weekly_golden.py --dry-run

  frontend:
    name: Frontend (vue-tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Test (vitest + coverage gate)
        run: npx vitest run --coverage

  frontend-e2e:
    name: Frontend E2E (Playwright citations smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke (mock SSE)
        run: npm run test:e2e
